services:
  mysql:
    image: mysql:8
    container_name: sjs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: bd_sjs
    volumes:
      - sjs_mysql_data:/var/lib/mysql
    # sem porta publicada: só o backend, na mesma rede, precisa acessar o banco

  backend:
    build: ./backend
    container_name: sjs-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bd_sjs
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_NOME: ${ADMIN_NOME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  sjs_mysql_data:
