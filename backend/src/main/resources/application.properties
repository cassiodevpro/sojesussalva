spring.application.name=backend
server.port=${SERVER_PORT:8081}

# Conexão com banco de dados (sobe com: docker compose up -d)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/bd_sjs}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Dialeto do Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Mostrar queries no console (opcional)
spring.jpa.show-sql=true

# JWT (troque app.jwt.secret em produção via variável de ambiente)
app.jwt.secret=${JWT_SECRET:c2Vhc2VncmV0b3JuYW9jb21wYXJ0aWxoZXNlZ3JlZG9lbXByb2R1Y2Fv}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin padrão criado no primeiro start, caso ainda não exista nenhum admin
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@sojesussalva.com}
app.admin.senha=${ADMIN_SENHA:Admin@123}
